name: release

# インストーラを作って Releases に貼る。次のいずれかで動く。
#   - v1.2.3 のようなタグを push したとき
#   - release ブランチへ push したとき
#   - Actions 画面の「Run workflow」を押したとき
# タグ以外のときは package.json の version をリリース名に使う。
on:
  push:
    tags: ['v*']
    # タグを押せない環境から配布物を作るための経路。
    # release ブランチへ push すると package.json の version でリリースする。
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 貼り付け先のタグ名を決める
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run build

      - name: インストーラを作る
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

      - name: Releases に貼る
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: release/*.exe
          draft: false
          generate_release_notes: true
